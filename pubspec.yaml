name: qingzhou_focus
description: "轻舟 — 沉浸式学习专注器"
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 本地持久化
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # 图表
  fl_chart: ^0.70.2

  # 通知与震动
  flutter_local_notifications: ^18.0.1
  vibration: ^2.0.1

  # 路由
  go_router: ^14.8.1

  # 图标

  # 应用内更新检查
  http: ^1.2.0
  url_launcher: ^6.3.0

  # 工具
  uuid: ^4.5.1
  intl: ^0.20.2
  package_info_plus: ^8.3.1
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  permission_handler: ^13.0.2
  wakelock_plus: ^1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 桌面图标生成：dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "design/logo/icon_full.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "design/logo/icon_adaptive_bg.png"
  adaptive_icon_foreground: "design/logo/icon_adaptive_fg.png"
  # 包默认 16% 内缩会让内容再缩一圈，构图时已按安全区设计，这里取消内缩
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: "design/logo/icon_full.png"
    background_color: "#F8F4EB"
    theme_color: "#426464"

flutter:
  uses-material-design: true

  assets:
    - assets/data/university_ranking.json
    - assets/data/discipline_catalog.json
